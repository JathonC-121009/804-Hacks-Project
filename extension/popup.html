<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Output-Waste Optimizer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5ef;
    --ink: #17201c;
    --muted: #6b756e;
    --line: #dcdfd6;
    --accent: #26765d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161a17; --ink: #edf1ee; --muted: #9ca8a1; --line: #303833; --accent: #6cc6a5; }
  }
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); }

  .score { margin: 10px 0 2px; font-size: 44px; font-weight: 700; line-height: 1;
           letter-spacing: -.04em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .score-label { font-size: 12px; color: var(--muted); }

  .rows { margin: 16px 0 0; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
         padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

  .caption { margin: 9px 0 0; font-size: 11px; color: var(--muted); }

  .toggle { display: flex; gap: 8px; align-items: center; margin: 16px 0 0; cursor: pointer; }
  .toggle input { margin: 0; accent-color: var(--accent); }

  button { width: 100%; margin-top: 14px; padding: 7px; font: inherit; font-size: 12px;
           color: var(--muted); background: transparent; border: 1px solid var(--line);
           border-radius: 7px; cursor: pointer; }
  button:hover { color: var(--ink); border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dim { opacity: .45; }
  code { font-size: 11px; }
</style>
</head>
<body>
  <h1>Output-Waste Optimizer</h1>

  <div class="score" id="eff">&mdash;</div>
  <div class="score-label">output efficiency</div>

  <dl class="rows" id="rows">
    <div class="row"><dt>Tokens wasted</dt><dd id="w-tokens">0</dd></div>
    <div class="row"><dt>Energy</dt><dd id="w-energy">0 Wh</dd></div>
    <div class="row"><dt>Water</dt><dd id="w-water">0 mL</dd></div>
    <div class="row"><dt>CO&#8322;</dt><dd id="w-co2">0 g</dd></div>
  </dl>

  <p class="caption" id="caption">No replies measured yet.</p>

  <label class="toggle">
    <input type="checkbox" id="auto">
    <span>Auto-add output limits</span>
  </label>
  <p class="caption">Appends &ldquo;answer directly, no recap&rdquo; to your draft, with undo. Never trims your own words.</p>

  <button id="reset" type="button">Reset totals</button>

  <p class="caption">
    Paste-in analyzer: run <code>npm run dev</code>, then open <code>localhost:5173</code>.
  </p>

  <script src="popup.js"></script>
</body>
</html>
